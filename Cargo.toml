[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/detect",
    "crates/db",
    "crates/auth",
    "crates/queue",
    "crates/github",
    "crates/container",
    "crates/mcp-runtime",
    "crates/email",
    "crates/api",
    "crates/proxy",
    "crates/builder",
    "crates/billing",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nodeflare-dev/nodeflare"
authors = ["Nodeflare Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "request-id", "timeout", "set-header", "limit"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json"] }

# Redis
# fred 9.x upgrades rustls 0.21/0.22 -> 0.23 (rustls-webpki 0.103, fixes
# RUSTSEC-2026-0049/0098/0099/0104). The Redis-prefix renames only land in 10.0,
# so 9.x is source-compatible here. `enable-rustls-ring` keeps the pure-Rust ring
# provider (consistent with sqlx tls-rustls-ring; no aws-lc-rs / C toolchain needed).
# fred 9 gates commands behind granular `i-*` features; the default `i-std` set
# covers KeysInterface but NOT scripting, so `i-scripts` is added back for
# LuaInterface::eval (used by rate-limit / affinity Lua scripts). fred 8 bundled
# these by default.
fred = { version = "9.4", features = ["enable-rustls-ring", "i-scripts"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# Auth
jsonwebtoken = "9.3"
argon2 = "0.5"
# NOTE: oauth2 crate removed — it was declared but unused (OAuth flows use raw
# reqwest with hardcoded provider URLs). It pulled reqwest 0.11 -> rustls 0.21 ->
# rustls-webpki 0.101.7 (RUSTSEC-2026-0098/0099/0104). Re-add as v5+ if ever needed.
ring = "0.17"

# Validation
validator = { version = "0.19", features = ["derive"] }

# Error handling
thiserror = "2.0"
# 1.0.103 patches RUSTSEC-2026-0190 (unsound Error::downcast_mut); floor pinned
# because Cargo.lock is gitignored and cannot carry the resolved version.
anyhow = "1.0.103"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenAPI
utoipa = { version = "4", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }
utoipa-scalar = { version = "0.1", features = ["axum"] }

# Utils
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
dotenvy = "0.15"
config = "0.14"

# Job queue
apalis = "0.6"
apalis-redis = "0.6"

# Docker
bollard = "0.18"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Bytes
bytes = "1.9"

[profile.release]
# Build speed over peak optimization: full LTO + codegen-units=1 made the mcp-api
# compile/link take ~15min, blowing past Fly's remote-build deadline. For an I/O-bound
# service the runtime difference is negligible; reliable deploys matter more.
lto = false
codegen-units = 16
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
