name: Builder CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/**"
      - ".github/workflows/builder-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/**"
      - ".github/workflows/builder-ci.yml"

permissions:
  contents: read

concurrency:
  group: builder-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test mcp-builder
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select repository Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-builder-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-builder-

      - name: Run builder tests
        run: cargo test -p mcp-builder
